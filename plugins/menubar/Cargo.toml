[package]
name = "menubar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["UI_Shell", "Foundation_Metadata", "Win32_System_WinRT", "Media_Control", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Devices_Radios", "Foundation_Collections"] }

[build-dependencies]
embed-resource = "3"
