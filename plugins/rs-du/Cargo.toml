[package]
name = "rs-du"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
